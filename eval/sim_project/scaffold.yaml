framework:
  version: "1.0"
  project_name: "SimTrader"
  architecture_layers: 6

profile: interactive
rigor: standard

graph:
  db_path: ".scaffold/graph.db"
  languages:
    - python
    - go
    - rust
  plans_dir: "docs/ai/plans/"
  contracts_dir: "docs/ai/contracts/"
  learnings_file: "docs/ai/state/learnings_tracker.md"
  studies_dir: "docs/studies/"
  adrs_dir: "docs/ai/adrs/"
  spikes_dir: "docs/ai/spikes/"
  workflow_state_file: "docs/ai/state/workflow_state.md"
  embeddings: false
  communities: true

domains:
  - trading

standards:
  core:
    - errors
    - logging
    - config
    - testing
  domain:
    - traceability

prohibitions:
  emojis: true

reviews:
  expert_reviewers:
    - name: quant_architect
      cursor_description: >
        Deep review of trading plans, risk models, and execution logic.
        Load when reviewing plans that touch libs/risk/, libs/execution/,
        or libs/strategy/.
      file_patterns:
        - "libs/risk/**"
        - "libs/execution/**"
        - "libs/strategy/**"
    - name: devils_advocate
      cursor_description: >
        Adversarial pressure-test of any plan's assumptions and edge cases.
        Load when stress-testing a plan before implementation.

enforcement:
  prohibitions_on_write: true
  auto_orient_on_session: true

platforms:
  cursor:
    generate_hooks: true
    generate_agents: true
  claude_code:
    generate_hooks: true
    generate_agents: true
