name: Public content

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Scan tracked files
        env:
          PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}
        run: python scripts/check_public_content.py --all --require-private

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}
        run: python scripts/check_public_content.py --messages "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --require-private

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          PUBLIC_CONTENT_DENYLIST: ${{ secrets.PUBLIC_CONTENT_DENYLIST }}
        run: python scripts/check_public_content.py --messages "${{ github.event.before }}..${{ github.event.after }}" --require-private
