# scaffold.yaml -- agentscaffold
# Generated by AgentScaffold on 
#
# This file configures the AgentScaffold framework for your project.
# Regenerate agent files after editing: scaffold agents generate

framework:
  version: "1.0"
  project_name: "agentscaffold"
  architecture_layers: 6

profile: interactive
rigor: standard

domains: []

gates:
  draft_to_review:
    plan_lint: true
    architecture_layer_check: true

  review_to_ready:
    devils_advocate: true
    expansion_review: true
    spike_for_high_uncertainty: true
    interface_contracts: true
    security_review: true
    domain_reviews: []

  ready_to_in_progress:
    review_checklist: true
    approval_gates: true
    interactive_gate: true

  in_progress_to_complete:
    all_steps_checked: true
    validation_commands: true
    tests_pass: true
    retrospective: true
    domain_implementation_review: false

approval_required:
  breaking_changes: true
  security_sensitive: true
  data_migrations: true
  infrastructure: true
  external_apis: true

standards:
  core:
    - errors
    - logging
    - config
    - testing
  domain: []

prohibitions:
  emojis: false
  patterns: []

agents:
  agents_md: true
  cursor_rules: true

semi_autonomous:
  enabled: false
  session_tracking: true
  context_handoff: true
  safety:
    read_only_paths:
      - "docs/ai/system_architecture.md"
      - "scaffold.yaml"
      - ".github/"
    require_approval_paths:
      - "infra/"
      - "docs/security/"
  notifications:
    enabled: true
    channel: github_issue
    notify_on:
      - plan_complete
      - escalation
      - validation_failure
      - approval_required
  cautious_execution:
    max_fix_attempts: 2
    max_new_files_before_escalation: 5

task_runner:
  justfile: true
  makefile: true

ci:
  provider: github
  security_scanning: true
  study_lint: true
  plan_lint: false
  semi_autonomous_pr_checks: false

freshness:
  async_enabled: true
  debounce_seconds: 120
  gate_strict: false
  background_queue_enabled: true

graph:
  db_path: ".scaffold/graph.duckdb"
  backend: duckpgq
  incremental_community_refresh: structure
  incremental_community_threshold: 25
  incremental_min_interval_seconds: 0
  embedding_min_interval_seconds: 0
  async_embeddings: "off"

import:
  conversation_dir: "data/conversations"
